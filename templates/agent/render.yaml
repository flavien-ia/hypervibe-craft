# render.yaml - Render Blueprint for the agent Background Worker.
#
# After committing this file, the user creates a "New Blueprint Instance" in
# the Render dashboard pointing at the GitHub repo. Render then provisions
# the worker automatically.
#
# Background Worker (not Web Service):
#   - Always running (no sleep on free tier of paid plans)
#   - No public HTTP exposure (we trigger via DB polling - see entry.ts)
#   - Captures stdout/stderr to Render's log viewer
#
# Plan - `starter` is the cheapest paid tier ($7/mo). Free tier no longer
# offers Background Workers (since 2024). If the user wants free, they'd
# have to switch to a Web Service + accept the 15-min sleep, which defeats
# the agent use case.
#
# Env vars are NOT defined here - they come from the Render dashboard, where
# they are set by hand: _create-agent lists them, nothing copies them for you.

services:
  - type: worker
    # The project's name, then the agent's: the service is the project's, and
    # /delete-project finds it by that name as well as by the manifest entry
    # _create-agent records once the Blueprint is applied.
    name: {{RENDER_SERVICE_NAME}}
    runtime: node
    plan: starter
    # Frankfurt, in the EU. A Blueprint that names no region gets Render's
    # default, Oregon (USA), and a service never changes region afterwards.
    region: frankfurt
    rootDir: apps/{{AGENT_NAME}}
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false  # set in dashboard, not committed
      - key: DATABASE_URL
        sync: false
      - key: BREVO_CLIENT_ID
        sync: false  # the project's Brevo sending application (3.4.34)
      - key: BREVO_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false  # only a project that still sends with a key made by hand
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: AGENT_DAILY_BUDGET_USD
        value: "5"
      - key: AGENT_MONTHLY_BUDGET_USD
        value: "50"
      - key: AGENT_CRON_SCHEDULE
        sync: false  # optional - set if the agent has a scheduled run
      - key: AGENT_CRON_PROMPT
        sync: false  # optional - used for cron-triggered runs
      - key: CLOUDFLARE_API_TOKEN
        sync: false  # optional - required only if --memory=pgvector
                     # (vector memory uses Cloudflare Workers AI embeddings)
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false  # optional - same case
